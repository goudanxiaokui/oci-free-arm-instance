name: Try to Create OCI VM
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: "ocid1.image.oc1.phx.aaaaaaaaufk34i3h6pc66mifse3yqpstkdbbohmlgpry7gu2ew6fq7faf5pa"
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: "galr:PHX-AD-1"
  OCI_CLI_REGION: "us-phoenix-1"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI
        run: |
          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ env.OCI_CLI_REGION }}" >> ~/.oci/config
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

      - name: Loop and Try to Create VM (60~70s interval)
        id: create_vm
        run: |
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "===== 第 $ATTEMPT 次尝试 $(date '+%H:%M:%S') ====="

            OCI_OUTPUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "free-arm-vm" \
              --boot-volume-size-in-gbs 200 2>&1 || true)

            echo "$OCI_OUTPUT"

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "🎉 抢购成功！"
              echo "success=true" >> $GITHUB_OUTPUT

              # 提取实例 IP
              INSTANCE_ID=$(echo "$OCI_OUTPUT" | grep '"id"' | head -1 | awk -F'"' '{print $4}')
              echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

              curl -s -X POST "${{ secrets.WECOM_WEBHOOK_URL }}" \
                -H "Content-Type: application/json" \
                -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"🎉 OCI ARM 实例抢购成功！\n区域: Phoenix (us-phoenix-1)\n第 $ATTEMPT 次尝试成功\n请立即去 OCI 控制台查看并关闭 GitHub Actions 工作流！\"}}"
              exit 0
            else
              # 随机等待 60~70 秒再重试
              WAIT=$((60 + RANDOM % 11))
              echo "容量不足，等待 ${WAIT} 秒后重试..."
              sleep $WAIT
            fi
          done
